# nouveau and the NVIDIA driver cannot drive the same GPU
blacklist nouveau
# kernel modesetting (Wayland compositors need it) and the framebuffer console on nvidia-drm
options nvidia-drm modeset=1 fbdev=1
# the rest of the driver follows nvidia, which udev loads for the GPU: KMS and unified memory (CUDA)
softdep nvidia post: nvidia-drm nvidia-uvm
