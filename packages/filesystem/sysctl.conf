# CleanLinux defaults, applied at boot by `sysctl --system`; override them in /etc/sysctl.d/.
# A leading "-" ignores keys the running kernel does not have.

# games (Proton, many native titles) need far more memory maps than the default 65530
vm.max_map_count = 1048576
# x86: split locks are still reported, but the offending task is not slowed down
# (some games use them and would stutter)
-kernel.split_lock_mitigate = 0
