# CleanLinux defaults, applied at boot by `sysctl --system`; override them in /etc/sysctl.d/.
# A leading "-" ignores keys the running kernel does not have.
# Only general defaults live here: tuning for a particular workload belongs to spins,
# whose packages add their own files to /usr/lib/sysctl.d/.

# the default of Arch, Fedora and Ubuntu: programs that map many regions (Wine, some games,
# databases, JVMs) need more than the kernel's 65530
vm.max_map_count = 1048576
